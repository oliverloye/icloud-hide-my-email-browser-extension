name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Settings parse
        run: python -m json.tool .claude/settings.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Prettier formatting
        run: npm run prettier:check
      - name: Linting
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build
